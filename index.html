<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSA セイフティサブアセッサー 模擬試験アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // Supabaseの設定
        const SUPABASE_URL = 'https://imrblbkkpnjxfybayzmb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_X7g7oDXAye8StMaE9ro9IA_24Qybzst'; 
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabase = supabase;
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold">SSA 資格試験対策アプリ</h1>
            <div id="user-info" class="text-sm"></div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-3xl w-full mx-auto p-4 flex flex-col justify-center">

        <!-- 認証画面（未ログイン時） -->
        <div id="auth-container" class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h2 class="text-xl font-bold text-center text-slate-700">ログイン / アカウント作成</h2>
            <p class="text-xs text-slate-500 text-center">学習履歴をクラウド保存するため、メールアドレスでログインしてください。</p>
            <div>
                <label class="block text-sm font-medium text-slate-600">メールアドレス</label>
                <input type="email" id="email" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="example@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600">パスワード</label>
                <input type="password" id="password" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">ログイン</button>
                <button onclick="handleSignup()" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-lg font-medium hover:bg-slate-300 transition">新規登録</button>
            </div>
            <p id="auth-msg" class="text-sm text-center text-red-500 mt-2"></p>
        </div>

        <!-- ダッシュボード（ログイン後） -->
        <div id="app-container" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md text-center space-y-4">
                <h2 class="text-2xl font-bold text-slate-700">機械安全・リスクアセスメント編</h2>
                <p class="text-sm text-slate-500">規格（ISO 12100 / IEC 61508等）や安全法規に関する模擬試験です。</p>
                <button onclick="startQuiz()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 transition shadow">模擬試験を開始する</button>
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-slate-600 underline">ログアウト</button>
            </div>

            <!-- 履歴表示エリア -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="font-bold text-slate-700 mb-3">これまでの試験実績</h3>
                <div id="history-list" class="space-y-2 text-sm text-slate-600">読み込み中...</div>
            </div>
        </div>

        <!-- クイズ画面 -->
        <div id="quiz-container" class="hidden bg-white p-6 rounded-xl shadow-md space-y-4">
            <div class="flex justify-between text-sm text-slate-400">
                <span id="question-progress">問題 1 / 5</span>
                <span id="question-category">安全法規</span>
            </div>
            <h3 id="question-text" class="text-lg font-bold text-slate-800">問題文がここに入ります。</h3>
            <div id="options-container" class="space-y-2">
                <!-- 選択肢ボタンが動的に入ります -->
            </div>
            <div id="explanation-box" class="hidden p-4 bg-slate-50 rounded-lg text-sm space-y-2 border">
                <p id="explanation-text" class="text-slate-700"></p>
                <button onclick="nextQuestion()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">次へ進む</button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-container" class="hidden bg-white p-6 rounded-xl shadow-md text-center space-y-4">
            <h2 class="text-2xl font-bold text-slate-700">試験終了！</h2>
            <p class="text-xl font-semibold text-indigo-600" id="result-score">正答率: 80% (4 / 5)</p>
            <p class="text-sm text-slate-500">成績がSupabaseに保存されました。</p>
            <button onclick="returnToDashboard()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">ダッシュボードに戻る</button>
        </div>

    </main>

    <script>
        const questions = [
            {
                category: "安全法規・規格",
                text: "機械安全の基本概念に関する国際規格で、リスクアセスメントおよびリスク低減の原則を規定しているものはどれか。",
                options: ["ISO 12100", "ISO 13849-1", "IEC 61508", "ISO 14001"],
                answer: 0,
                explanation: "ISO 12100は、機械の設計に関する包括的な安全基準であり、リスクアセスメントとリスク低減の基本概念を規定しています。"
            },
            {
                category: "リスクアセスメント",
                text: "リスク低減方策の優先順位において、最初に検討すべきものはどれか。",
                options: ["使用上の情報（警告など）", "付加保護方策（インターロック等）", "本質安全設計方策", "保護具の着用"],
                answer: 2,
                explanation: "3段階ステップの原則に基づき、まずは機械自体に危険源を除去・低減させる「本質安全設計方策」を最優先で検討します。"
            },
            {
                category: "機能安全",
                text: "制御システムの安全関連部に求められる信頼性や耐故障性を表す指標として、ISO 13849-1で規定されているものはどれか。",
                options: ["SIL (Safety Integrity Level)", "PL (Performance Level)", "MTBF", "IPコード"],
                answer: 1,
                explanation: "ISO 13849-1では、カテゴリと合わせてパフォーマンスレベル（PL a〜e）を用いて安全関連制御系統の能力を評価します。"
            },
            {
                category: "リスクアセスメント",
                text: "危険源の特定（ハザード・アイデンティフィケーション）において考慮すべき事項として、不適切なものはどれか。",
                options: ["機械の意図した使用", "予見可能な誤使用", "機械のライフサイクルの全フェーズ", "オペレーターの年齢・性別"],
                answer: 3,
                explanation: "リスクアセスメントでは、意図した使用や予見可能な誤使用、ライフサイクル全般を考慮しますが、個人の属性（年齢や性別など）は対象外です。"
            },
            {
                category: "安全法規・規格",
                text: "労働安全衛生法において、特定の機械等に対して製造段階での検査や安全基準の適合を義務付けている制度はどれか。",
                options: ["型式検定", "CEマーキング", "ISO認証", "PL法適用"],
                answer: 0,
                explanation: "危険性の高い機械等については、構造や性能が基準に適合しているかを確認する「型式検定」が義務付けられています。"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let wrongIds = [];

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (window.supabase) {
                    window.supabase.auth.onAuthStateChange((event, session) => {
                        if (session) {
                            document.getElementById('auth-container').classList.add('hidden');
                            document.getElementById('app-container').classList.remove('hidden');
                            document.getElementById('user-info').innerText = `${session.user.email}`;
                            loadHistory();
                        } else {
                            document.getElementById('auth-container').classList.remove('hidden');
                            document.getElementById('app-container').classList.add('hidden');
                            document.getElementById('quiz-container').classList.add('hidden');
                            document.getElementById('result-container').classList.add('hidden');
                            document.getElementById('user-info').innerText = '';
                        }
                    });
                }
            }, 500);
        });

        async function handleSignup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await window.supabase.auth.signUp({ email, password });
            if (error) document.getElementById('auth-msg').innerText = error.message;
            else alert('確認メールを送信しました。メール内のリンクを確認してください。');
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await window.supabase.auth.signInWithPassword({ email, password });
            if (error) document.getElementById('auth-msg').innerText = error.message;
        }

        async function handleLogout() {
            await window.supabase.auth.signOut();
        }

        function startQuiz() {
            currentIdx = 0;
            score = 0;
            wrongIds = [];
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-progress').innerText = `問題 ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('explanation-box').classList.add('hidden');

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-3 border rounded-xl hover:bg-slate-100 transition font-medium';
                btn.innerText = `${idx + 1}. ${opt}`;
                btn.onclick = () => selectAnswer(idx);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selected) {
            const q = questions[currentIdx];
            const buttons = document.getElementById('options-container').children;
            
            for(let i=0; i<buttons.length; i++) {
                buttons[i].disabled = true;
                if(i === q.answer) {
                    buttons[i].classList.add('bg-green-100', 'border-green-500');
                } else if(i === selected) {
                    buttons[i].classList.add('bg-red-100', 'border-red-500');
                }
            }

            if(selected === q.answer) {
                score++;
            } else {
                wrongIds.push(currentIdx);
            }

            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < questions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById('result-score').innerText = `正答率: ${percentage}% (${score} / ${questions.length})`;

            const { data: { user } } = await window.supabase.auth.getUser();
            if(user) {
                await window.supabase.from('exam_history').insert([{
                    user_id: user.id,
                    category: '機械安全総合模試',
                    score: percentage,
                    total_questions: questions.length,
                    correct_count: score,
                    wrong_question_ids: wrongIds
                }]);
                loadHistory();
            }
        }

        function returnToDashboard() {
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
        }

        async function loadHistory() {
            const { data, error } = await window.supabase
                .from('exam_history')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(5);

            const listEl = document.getElementById('history-list');
            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<p class="text-slate-400">まだ受験履歴がありません。</p>';
                return;
            }

            listEl.innerHTML = data.map(h => `
                <div class="flex justify-between p-2 bg-slate-50 rounded border">
                    <span>${new Date(h.created_at).toLocaleString()}</span>
                    <span class="font-bold text-indigo-600">${h.score}% (${h.correct_count}/${h.total_questions})</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
